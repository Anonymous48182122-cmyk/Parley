name: Refresh company lists

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # the BSE refuses some cloud hosts; when it does the saved copy simply stays
      - run: python scripts/refresh_bse_snapshot.py
        continue-on-error: true
      # the saved search index the app loads, rebuilt from the same lists the server searches
      - run: python scripts/generate_ticker_index.py
      - name: Commit if a list changed
        run: |
          git config user.name "Parley Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bse_snapshot.json frontend/public/ticker-index.json
          git diff --cached --quiet || (git commit -m "Refresh the company lists" && git push)
